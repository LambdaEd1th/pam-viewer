name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-dioxus-0.7.9-${{ hashFiles('Cargo.lock') }}
      - name: Install Dioxus CLI
        run: command -v dx >/dev/null 2>&1 || cargo install dioxus-cli --version 0.7.9 --locked
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --version 0.15.0 --locked
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build Web Worker runtimes
        run: ./scripts/build-web-runtime.sh
      - name: Build WebAssembly application
        run: dx build --release --platform web --package pam-viewer-app --locked
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/dx/pam-viewer/release/web/public
      - id: deployment
        uses: actions/deploy-pages@v5
