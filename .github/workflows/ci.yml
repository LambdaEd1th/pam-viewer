name: Rust CI

on:
  pull_request:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --version 0.15.0 --locked
      - name: Build Web Worker runtimes
        run: ./scripts/build-web-runtime.sh
      - run: cargo check --target wasm32-unknown-unknown -p pam-viewer-app --locked

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: pam-viewer-macos
            binary: target/release/pam-viewer
          - os: windows-latest
            artifact: pam-viewer-windows
            binary: target/release/pam-viewer.exe
          - os: ubuntu-latest
            artifact: pam-viewer-linux
            binary: target/release/pam-viewer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release -p pam-viewer-app --locked
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
